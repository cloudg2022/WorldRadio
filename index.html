<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131e"><meta name="description" content="Radio mundial: busca emisoras, escucha y guarda favoritas"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>World Radio</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#10131e;color:#f3f5ff}*{box-sizing:border-box}body{margin:0;padding-bottom:115px}header{position:sticky;top:0;z-index:5;background:#10131ef2;backdrop-filter:blur(14px);padding:18px 18px 12px;border-bottom:1px solid #30364a}h1{font-size:25px;margin:0 0 5px}header p{margin:0;color:#aab4cf;font-size:13px}.wrap{max-width:850px;margin:auto}main{padding:18px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,button{font:inherit}input,select{width:100%;border:1px solid #3c4661;border-radius:12px;background:#1b2234;color:white;padding:12px;min-width:0}#search{grid-column:1/-1}button{cursor:pointer;border:0;border-radius:12px;background:#28334b;color:white;padding:11px 13px}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #8ca7ff}.tabs{display:flex;gap:8px;margin:16px 0}.tabs button{flex:1}.tabs .active,.primary{background:#6864e8;color:white}.status{color:#aab4cf;font-size:13px;min-height:23px;margin:10px 0}.station{display:flex;align-items:center;gap:12px;padding:11px;margin:9px 0;background:#1b2234;border:1px solid #2b344b;border-radius:15px}.logo{height:48px;width:48px;object-fit:contain;background:#111827;border-radius:9px;flex-shrink:0}.info{min-width:0;flex:1}.name{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sub{font-size:12px;color:#aab4cf;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}.station button{flex-shrink:0}.heart{font-size:22px;background:transparent;padding:8px}.heart.saved{color:#ff708e}.load{width:100%;margin:16px 0;background:#303e60}.player{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#20283d;border-top:1px solid #414d6b;box-shadow:0 -8px 30px #0007;padding:11px max(14px,env(safe-area-inset-right)) calc(11px + env(safe-area-inset-bottom))}.player-inner{max-width:850px;margin:auto;display:flex;gap:10px;align-items:center}.player .logo{height:42px;width:42px}.player button{padding:9px}.player .info{cursor:pointer}.player small{display:block;color:#b4c1dd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player .volume{width:85px;accent-color:#8c8aff}.player .play{background:#6864e8;font-size:20px;min-width:43px}.more{max-width:850px;margin:9px auto 0;display:none;gap:10px;align-items:center}.player.expanded .more{display:flex}.more input{flex:1}.hint{color:#9da9c6;font-size:13px;line-height:1.5;margin-top:20px}@media(max-width:420px){.player .volume{display:none}.station{gap:7px}.station button{padding:8px}.logo{width:42px;height:42px}} </style></head><body><header><div class="wrap"><h1>📻 World Radio</h1><p>Emisoras de todo el mundo, en tu bolsillo</p></div></header><main class="wrap"><section class="filters"><input id="search" placeholder="Buscar emisora por nombre…" aria-label="Buscar emisora"><select id="country" aria-label="País"><option value="">Todos los países</option></select><select id="tag" aria-label="Género"><option value="">Todos los géneros</option><option>pop</option><option>rock</option><option>jazz</option><option>classical</option><option>news</option><option>talk</option><option>electronic</option><option>dance</option><option>80s</option><option>90s</option><option>ambient</option><option>latin</option></select><select id="language" aria-label="Idioma"><option value="">Todos los idiomas</option><option value="spanish">Español</option><option value="english">Inglés</option><option value="french">Francés</option><option value="german">Alemán</option><option value="italian">Italiano</option><option value="portuguese">Portugués</option></select><button id="random">🎲 Aleatoria</button></section><div class="tabs"><button id="discover" class="active">🌍 Explorar</button><button id="favorites">♥ Favoritos <span id="count"></span></button></div><div id="status" class="status" role="status"></div><div id="results"></div><button id="load" class="load" hidden>Cargar más emisoras</button><p class="hint">Catálogo comunitario de Radio Browser. Algunas emisoras pueden no estar disponibles o bloquear la reproducción en ciertos navegadores. Los favoritos se guardan en este dispositivo.</p></main><div class="player" id="player"><div class="player-inner"><img class="logo" id="playerLogo" src="icon.svg" alt=""><div class="info" id="toggleMore" title="Mostrar controles"><div class="name" id="playerName">Elige una emisora</div><small id="playerStatus">Sin reproducción</small></div><button id="playerFav" class="heart" aria-label="Añadir a favoritos">♡</button><button id="play" class="play" aria-label="Reproducir">▶</button><button id="expand" aria-label="Expandir reproductor">⌃</button></div><div class="more"><span>🔊</span><input id="volume" type="range" min="0" max="100" value="80" aria-label="Volumen"><button id="mute">Silenciar</button></div></div><audio id="audio" preload="none"></audio><script src="app.js" defer></script></body></html>
